apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-client
  labels:
    app: {{ .Release.Name }}-client
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-client
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  env:
    - name: API_BASE_URL
      value: {{ .Values.api.baseUrl | quote }}